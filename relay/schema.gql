  """
  payout: Decimal

  """
  stake × effectiveOdds if every item wins.
  """
  potentialPayout: Decimal!
  rejectReason: String

  """
  True when an operator corrected this ticket after acceptance (see `corrections`).
  """
  resettled: Boolean!

  """
  Time of the latest correction.
  """
  resettledAt: DateTimeISO

  """
  False until the player acknowledges the latest correction (acknowledgeResettlements); drives the notification.
  """
  resettlementSeen: Boolean!
  settledAt: DateTimeISO
  stake: Decimal!
  status: TicketStatus!
}

type TicketConnection {
  edges: [TicketEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

"""
An operator correction to one selection after acceptance, applied under the house rules for obvious price errors and result corrections.
"""
type TicketCorrection {
  """
  Change to what the ticket pays: positive was credited to the player, negative taken back. 0 when the ticket was still open.
  """
  amount: Decimal!
  createdAt: DateTimeISO!
  id: ID!

  """
  Global ID of the corrected TicketItem.
  """
  itemId: ID!
  kind: CorrectionKind!
  newPrice: Decimal!
  newStatus: BetItemStatus!
  previousPrice: Decimal!
  previousStatus: BetItemStatus!
}

type TicketEdge {
  cursor: String!
  node: Ticket!
}

"""
One selection on a ticket, frozen at placement.
"""
type TicketItem {
  """
  Global ID of the Event bet on.
  """
  eventId: ID!

  """
  Snapshot: "Home vs Away" style display name.
  """
  eventName: String!

  """
  Snapshot of kick-off time.
  """
  eventStartTime: DateTimeISO!
  id: ID!
  marketName: String!

  """
  Global ID of the Outcome bet on.
  """
  outcomeId: ID!
  outcomeName: String!

  """
  Odds this item settles at.
  """
  priceAtAcceptance: Decimal!
  status: BetItemStatus!
}

enum TicketStatus {
  ACCEPTED
  CASHED_OUT
  CASHOUT_PENDING
  LOST
  PARTIALLY_CASHED_OUT
  PENDING_ACCEPTANCE
  REJECTED
  VOID
  WON
}

enum TicketType {
  MULTIPLE
  SINGLE
  SYSTEM
}

"""
A change to one of the caller's tickets.
"""
type TicketUpdate {
  reason: TicketUpdateReason!
  ticket: Ticket!
}

enum TicketUpdateReason {
  RESETTLED
  SETTLED
}

"""
A competition (Premier League, ATP Wimbledon, NBA Regular Season, …).
"""
type Tournament implements Node {
  category: Category!

  """
  Bettable prematch events beneath this node. Lets the sidebar hide empty branches without walking the whole tree client-side.
  """
  eventCount: Int!

  """
  Cursor-paginated feed of events in this tournament.
  """
  events(
    after: String
    before: String

    """
    Filter by category `key` (e.g. `england`).
    """
    category: String

    """
    Only the signed-in player's bookmarked events. Requires a session.
    """
    favourites: Boolean

    """
    Take up to N edges after `after` (default 20, max 100).
    """
    first: Int

    """
    Take up to N edges before `before` (max 100).
    """
    last: Int

    """
    Free-text search over competitor and tournament names.
    """
    search: String

    """
    Filter by sport `key` (e.g. `football`).
    """
    sport: String

    """
    Only events starting strictly after this instant.
    """
    startAfter: DateTimeISO
    startBefore: DateTimeISO

    """
    Filter by tournament `key`s - multi-select (the sidebar allows several at once).
    """
    tournaments: [String!]
  ): EventConnection!
  id: ID!

  """
  Stable slug within the sport: `premier-league`, `la-liga`, `wimbledon`.
  """
  key: String!
  name: String!
  sport: Sport!

  """
  Editorial importance on one global cross-sport scale (0 = unranked, higher = more important). Sort tournaments or their events by this to surface marquee competitions first. Reflects the admin/back-office weight table.
  """
  weight: Int!
}

"""
Whether bets can be placed against this event right now.
"""
enum TradingStatus {
  CLOSED
  OPEN
  SUSPENDED
}
